[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/pytest-report.html
    --self-contained-html
    --timeout=120

markers =
    smoke: minimal critical-path suite, runs on every pull request
    ui: Playwright browser tests
    api: HTTP/API contract tests
    llm: tests that evaluate LLM output quality
    rag: retrieval-augmented-generation tests
    agent: LangGraph agent behaviour tests
    prompt: prompt engineering / comparison tests
    regression: prompt or metric regression gates
    security: AI security tests (injection, leakage, tool authorisation)
    performance: latency / cost / call-budget tests
    flagship: the showcase end-to-end scenarios
    slow: long-running; excluded from the PR pipeline

log_cli = false
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
